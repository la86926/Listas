<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const hoyU=['bolsas, chequeras negras','aspiradora','limpia, vidrios','Guantes para lejía','Bolsa de compras grande para guardar las cosas allí','Llaves','Trapos antipolvo','Jabón'],hoyC=['Banco Nación','Gasolina','Comprar agua','Recargar celular','Ir al banco','Llevar documentos','Pagar servicio','Comprar medicinas','Llamar a mamá'];const mk=(n,c,b)=>Array.from({length:n},(_,i)=>({id:id(),name:`${b} ${i+1}`,done:i<c}));function fresh(){return{lists:[{id:'compras',name:'compras',items:['Leche','Pan','Huevos','Arroz','Café'].map(name=>({id:id(),name,done:false}))},{id:'hoy',name:'Hoy',items:[...hoyU.map(name=>({id:id(),name,done:false})),...hoyC.map(name=>({id:id(),name,done:true}))]},{id:'ch',name:'Chulucanas hoy',items:mk(95,94,'Compra Chulucanas')},{id:'pi',name:'Piura hoy',items:mk(77,76,'Compra Piura')},{id:'lle',name:'Llevar para Piura',items:mk(10,1,'Llevar')},{id:'salud',name:'Vida y salud tienda naturista',items:['Avena','Semillas de chía','Miel','Almendras'].map((name,i)=>({id:id(),name,done:i===0}))}],trash:[['Sodimac Piura',78,81],['Lista vindela 2/10',8,9],['Precio uno',21,21],['al frente',4,4],['Verduras',3,6],['Precio uno 28 de agosto',4,4]].map(x=>({name:x[0],c:x[1],t:x[2],days:1275})),set:{last:false,awake:false,multiply:true,prices:true,showPrices:false,ai:true,sort:'custom',theme:'dark'},email:'la86926@gmail.com'}}let db;try{db=JSON.parse(localStorage.getItem('listas-v2'))||fresh()}catch(e){db=fresh()}let st={tab:'lists',view:'home',list:'hoy',over:null,menu:false,search:'',product:null,checked:true,selected:[]};const save=()=>localStorage.setItem('listas-v2',JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),stat=l=>({c:l.items.filter(x=>x.done).length,t:l.items.length}),nav=a=>`<nav class="nav"><button class="nb ${a==='lists'?'on':''}" data-tab="lists"><span class="ico">▣</span>Listas</button><button class="nb ${a==='products'?'on':''}" data-tab="products"><span class="ico">♣</span>Productos</button><button class="nb ${a==='assistant'?'on':''}" data-tab="assistant"><span class="ico">✦</span>Asistente</button><button class="nb ${a==='profile'?'on':''}" data-tab="profile"><span class="ico">♟</span>Perfil</button></nav>`,top=(t,b=false,r='')=>`<div class="top">${b?'<button class="ib" data-act="back">‹</button>':''}<h1>${t}</h1>${r}</div>`;function render(){document.body.classList.toggle('light',db.set.theme==='light');let h=st.tab==='lists'?lists():st.tab==='products'?products():st.tab==='assistant'?assistant():profile();$('#app').innerHTML=h;bind()}function lists(){if(st.view==='trash')return trash();if(st.view==='settings')return settings();if(st.view==='appearance')return appearance();if(st.view==='list')return list();if(st.view==='add')return add();return home()}function home(){return`<section class="screen">${top('Listas',false,'<button class="ib" data-act="menu"><span class="dots">•••</span></button>')}${db.lists.map(l=>{let s=stat(l);return`<div class="card listcard" data-open="${l.id}"><span class="mdots">⋮</span><h2>${esc(l.name)}</h2><div class="prow"><div class="prog"><i style="width:${s.t?s.c/s.t*100:0}%"></i></div><span class="cnt">${s.c}/${s.t}</span></div></div>`}).join('')}<button class="fab" data-act="new"><b>＋</b>Nueva lista</button>${st.menu?'<div class="popover"><button data-act="trash">🗑️ &nbsp; Papelera</button><button data-act="settings">⚙️ &nbsp; Ajustes</button></div>':''}</section>${nav('lists')}${over()}`}function trash(){return`<section class="screen">${top('Papelera',true,'<button class="ib">⌕</button><button class="ib">⋮</button>')}${db.trash.map((x,i)=>`<div class="card trash"><h2>${esc(x.name)} <span style="float:right;font-weight:500;font-size:19px">${x.c}/${x.t}</span></h2><div class="meta">Movido a la papelera hace ${x.days} días</div><div class="ta"><button class="red" data-deltrash="${i}">BORRAR</button><button class="green" data-rest="${i}">RESTAURAR</button></div></div>`).join('')}</section>${nav('lists')}`}function settings(){return`<section class="screen">${top('Ajustes',true)}<div style="display:flex;align-items:center;gap:14px;margin:8px 0 35px"><div class="avatar" style="width:49px;height:49px;margin:0"></div><b class="mut" style="font-size:18px;flex:1">${db.email}</b><span class="chev">›</span></div><div class="section">General</div><div class="box"><div class="row" data-act="appearance"><span class="grow">Apariencia</span><span class="chev">›</span></div><div class="row"><span class="grow">Notificaciones</span><span class="chev">›</span></div><div class="row"><span class="grow">Abrir la última lista usada al abrir la aplicación</span><span class="sw ${db.set.last?'on':''}" data-sw="last"></span></div><div class="row"><span class="grow">Mantener la pantalla encendida</span><span class="sw ${db.set.awake?'on':''}" data-sw="awake"></span></div><div class="row"><span class="grow">Eliminar publicidad<span class="sub">Conviértete en un usuario premium de Listas</span></span><span class="chev">⊘</span></div></div><div class="section">Preferencias de productos</div><div class="box"><div class="row"><span>Sugerencias de productos<span class="sub">A medida que escribes, aparecerán sugerencias de productos en el idioma seleccionado.</span></span></div></div><div class="section">Listas</div><div class="box"><div class="row"><span class="grow">Gestionar categorías</span><span class="chev">›</span></div><div class="row"><span class="grow">Administrar gestos</span><span class="chev">›</span></div><div class="row green"><span class="grow">Multiplicar (precio por cantidad)</span><span class="sw ${db.set.multiply?'on':''}" data-sw="multiply"></span></div><div class="row green"><span class="grow">Añadir automáticamente los últimos precios</span><span class="sw ${db.set.prices?'on':''}" data-sw="prices"></span></div></div><div class="section">Soporte</div><div class="box"><div class="row">Preguntas frecuentes <span class="chev" style="margin-left:auto">↗</span></div><div class="row">Reportar un problema <span class="chev" style="margin-left:auto">↗</span></div><div class="row">Feedback general <span class="chev" style="margin-left:auto">›</span></div><div class="row"><span>Actualizar listas<span class="sub">Esto actualizará todos los cambios en tus listas.</span></span><span class="chev" style="margin-left:auto">⟳</span></div></div></section>${nav('lists')}`}function appearance(){let x=db.set.theme==='dark'?'Oscuro':db.set.theme==='light'?'Claro':'El mismo del dispositivo';return`<section class="screen">${top('Apariencia',true)}<div class="section">General</div><div class="box"><div class="row" data-act="theme"><b class="grow">Tema oscuro</b><span class="mut">${x}</span></div></div><div class="section">Pantalla de inicio</div><div class="box"><div class="row"><b class="grow">Icono de la aplicación</b><span style="font-size:29px">📝</span><span class="chev">›</span></div></div></section>${nav(st.tab==='profile'?'profile':'lists')}${over()}`}function list(){let l=db.lists.find(x=>x.id===st.list)||db.lists[0],s=stat(l),u=l.items.filter(x=>!x.done),d=l.items.filter(x=>x.done),q=st.search.trim().toLowerCase();if(q){u=u.filter(x=>x.name.toLowerCase().includes(q));d=d.filter(x=>x.name.toLowerCase().includes(q))}let row=x=>`<div class="item ${x.done?'done':''}"><button class="check" data-check="${x.id}">${x.done?'✓':''}</button><span class="iname">${esc(x.name)}</span><span class="handle">═</span></div>`;return`<section class="screen"><div class="listhead">${st.search!==''?`<div class="top"><button class="ib" data-act="closeSearch">‹</button><div class="search" style="flex:1;margin:0">⌕<input id="ls" value="${esc(st.search)}" placeholder="buscar" autofocus></div></div>`:top(esc(l.name),true,'<button class="ib" data-act="share">♟⁺</button><button class="ib" data-act="listmenu"><span class="dots">•••</span></button>')}<div class="thin"><i style="width:${s.t?s.c/s.t*100:0}%"></i></div></div>${db.set.ai?'<div class="aib" data-act="toai"><span style="font-size:24px;color:#3d8de8">✦</span><span>¿No sabes qué comprar? ¡Pregunta al Asistente!</span><span class="chev" style="margin-left:auto">›</span></div>':''}<div class="items">${u.map(row).join('')}<div class="hide" data-act="checked">(${d.length}) ${st.checked?'Ocultar':'Mostrar'} elementos marcados ${st.checked?'⌃':'⌄'}</div>${st.checked?d.map(row).join(''):''}</div><button class="fab" data-act="add"><b>＋</b>Añadir</button></section>${nav('lists')}${over()}`}function add(){let q=st.search.toLowerCase(),arr=['pan','pañales','paneton','pantalón recoger','pañuelos higiénicos','pan blanco','pan de ajo','pan de jengibre','agua','arroz','aceite','leche','manzanas','tomates'].filter(x=>!q||x.includes(q)).slice(0,10);return`<section class="screen">${top('',true,`<div class="search" style="flex:1;margin:0">⌕<input id="addq" value="${esc(st.search)}" placeholder="Agregar nuevo producto" autofocus></div><button class="ib" style="background:#333">📷</button>`)}${arr.map(n=>{let sel=st.selected.includes(n);return`<div class="addrow" data-sug="${esc(n)}"><span class="rp ${sel?'sel':''}">${sel?'✓':'+'}</span><span style="font-size:20px;color:${sel?'#fff':'#aaa'}">${n}</span>${n==='pan'?'<span class="red" style="margin-left:auto;font-size:27px">×</span>':''}</div>`}).join('')}<button class="donebtn" data-act="doneadd">✓ &nbsp; Hecho</button></section>${nav('lists')}`}function products(){if(st.product)return pdetail();let a=P.filter(x=>x.n.toLowerCase().includes(st.search.toLowerCase()));return`<section class="screen products">${top('Productos',true)}<div class="search">⌕<input id="pq" value="${esc(st.search)}" placeholder="Buscar producto"></div><div class="grid">${a.map(x=>`<div class="prod" data-prod="${x.id}"><div class="pic">${x.e}</div><div class="pname">${esc(x.n)}</div></div>`).join('')}</div></section>${nav('products')}`}function pdetail(){let p=P.find(x=>x.id===st.product)||P[0];return`<section class="screen">${top('Productos',true)}<div class="search">⌕<input placeholder="Buscar producto"></div><div class="hero">${p.e}</div><div class="tags"><span class="tag">ALIMENTOS</span><span class="tag">SALUDABLE</span><span class="tag">FRESCO</span></div><h1 style="font-size:33px">${p.n}</h1><button class="cta" data-act="padd">AÑADE A TU LISTA &nbsp;＋</button><div class="article"><h2>Cómo conservar los ${p.n.toLowerCase()}</h2><p>Para ralentizar el proceso de maduración, lo mejor es mantener este producto en un lugar fresco. <strong>Colocarlo en el cajón de verduras</strong> puede ayudar a conservarlo durante más tiempo.</p><p>Evita el exceso de humedad y calor. <strong>Usar un recipiente adecuado</strong> ayuda a mantener el sabor y la textura.</p><div class="inf"><h3>✅ ¿Sabías que?</h3><p>Ordenar los alimentos por fecha de compra ayuda a consumir primero los que llevan más tiempo almacenados.</p></div><h2>Nutrición</h2><div class="facts"><div><span>Calorías</span><b>160 kcal</b></div><div><span>Proteínas</span><b>2 g</b></div><div><span>Carbohidratos</span><b>9 g</b></div><div><span>Grasas</span><b>15 g</b></div></div><h2>Ideas para usarlo</h2><p>Úsalo en ensaladas, sándwiches, sopas o platos caseros. También puedes incorporarlo a preparaciones rápidas.</p><div class="inf med"><h3>👨‍⚕️ Aviso médico</h3><p>Este contenido es solo informativo y no sustituye el consejo, diagnóstico o tratamiento profesional.</p></div></div></section>${nav('products')}`}function assistant(){return`<section class="screen">${top('Asistente')}<div class="assistant"><div class="spark">✦</div><h2>¿Qué necesitas comprar?</h2><p>Escribe una idea y te ayudo a preparar una lista rápida.</p><div class="ask"><input id="ask" placeholder="Ej. cena para 4 personas"><button data-act="ask">Preguntar</button></div></div><div class="section" style="margin-left:0">Sugerencias</div>${[['🥑','Desayuno saludable','Avena, fruta, yogur, huevos y palta.'],['🧽','Limpieza del hogar','Detergente, guantes, paños y limpiavidrios.'],['🥩','Parrilla','Carne, carbón, sal, verduras y bebidas.']].map(x=>`<div class="suggest" data-ai="${x[1]}"><span class="em">${x[0]}</span><div class="grow"><h3>${x[1]}</h3><p>${x[2]}</p></div><span class="chev">›</span></div>`).join('')}</section>${nav('assistant')}`}function profile(){if(st.view==='settings')return settings();if(st.view==='appearance')return appearance();return`<section class="screen">${top('Perfil',false,'<button class="ib" style="background:#2b2b2b;border:1px solid #3b3b3b" data-act="profileset">⚙</button>')}<div class="profile"><button class="edit">Editar ✎</button><div class="avatar"></div><h2>${db.email}</h2></div><div class="menu"><div class="row" data-act="profileset"><span>⚙</span><b class="grow">Ajustes</b><span class="chev">›</span></div><div class="row" data-act="appearance"><span>🎨</span><b class="grow">Apariencia</b><span class="chev">›</span></div><div class="row"><span>♥</span><span class="grow"><b>¿Disfrutas de la aplicación?</b><span class="sub">Califícanos ⭐⭐⭐⭐⭐ en la App Store</span></span><span class="chev">›</span></div><div class="row"><span>◉</span><b class="grow">Ayuda & Comentarios</b><span class="chev">›</span></div></div><div style="margin:28px 15px"><div style="width:90px;height:90px;border-radius:50%;border:5px solid var(--green);display:grid;place-items:center;font-size:42px">💸</div><p style="width:130px">Haz que cada céntimo cuente</p></div></section>${nav('profile')}`}function over(){if(!st.over)return'';if(st.over==='new')return`<div class="dialogbg"><div class="dialog"><h2>Nueva lista</h2><input id="newname" placeholder="Nombre de la lista" autofocus><div class="da"><button data-act="close">Cancelar</button><button class="primary" data-act="create">Crear</button></div></div></div>`;if(st.over==='share')return`<div class="overlay" data-bg><div class="sheet"><div class="grab"></div><div class="st"><h2>Comparte esta lista</h2><button class="close" data-act="close">×</button></div><p class="mut">Cuando se comparte la lista, todos los cambios son visibles instantáneamente para todos.</p><div class="shareicons"><div class="share"><span>🔗</span>Copiar enlace</div><div class="share"><span>💬</span>Mensajes</div><div class="share"><span>◉</span>WhatsApp</div><div class="share"><span>➤</span>Telegram</div><div class="share"><span>▣</span>Copiar texto</div></div><div class="search">⌕<span class="mut">Ingresa nombre o E-mail</span></div><div class="srow"><span style="font-size:30px">👤</span><span class="grow"><b>Sincronizar contactos</b><span class="sub">Elije un correo electrónico de la lista de contactos</span></span><span class="chev">×</span></div><div class="srow"><span style="width:44px;height:44px;border-radius:50%;background:#caa9ff;display:grid;place-items:center;color:#533c79">R</span><span class="grow"><b>Rahel Ze G</b><span class="sub">rahelz1989@gmail.com</span></span><button style="border:0;border-radius:22px;background:var(--blue);padding:10px 13px;font-weight:700">COMPARTIR</button></div></div></div>`;if(st.over==='listmenu')return`<div class="overlay" data-bg><div class="sheet"><div class="grab"></div><div class="sbox"><div class="srow" data-act="searchList">⌕ &nbsp; Buscar en la lista</div></div><div class="sbox"><div class="srow" data-act="share">♟⁺ &nbsp; Compartir</div></div><div class="sbox"><div class="srow" data-act="sort"><span>⇵</span><span class="grow">Ordenar por <span class="green">${db.set.sort==='custom'?'Personalizado':db.set.sort==='alpha'?'Alfabéticamente':'Categorías'}</span></span><span class="chev">›</span></div><div class="srow">🏷 <span class="grow">Mostrar precios</span><span class="sw ${db.set.showPrices?'on':''}" data-sw="showPrices"></span></div><div class="srow green">✦ <span class="grow">Mostrar sugerencias de IA</span><span class="sw ${db.set.ai?'on':''}" data-sw="ai"></span></div></div><div class="sbox"><div class="srow" data-act="uncheck">⟳ &nbsp; Desmarcar todos los elementos</div><div class="srow" data-act="checkall">✓ &nbsp; Marcar todos los artículos</div><div class="srow red" data-act="deleteDone">🗑 &nbsp; Eliminar artículos comprados</div></div></div></div>`;if(st.over==='sort')return`<div class="overlay" data-bg><div class="sheet"><div class="grab"></div><div class="st"><button class="ib" data-act="listmenu">‹</button><h2>Ordenar por</h2><button class="close" data-act="close">×</button></div><div class="sbox">${[['cat','Categorías'],['alpha','Alfabéticamente'],['custom','Personalizado']].map(x=>`<div class="srow ${db.set.sort===x[0]?'green':''}" data-sort="${x[0]}"><span class="grow">${x[1]}</span><span>${db.set.sort===x[0]?'●':'○'}</span></div>`).join('')}</div><div class="section">Elementos marcados</div><div class="sbox"><div class="srow">⌛ <span class="grow">Cronológicamente<span class="sub">Los productos comprados se ordenarán en el orden en que fueron marcados.</span></span><span class="sw"></span></div></div></div></div>`;if(st.over==='theme')return`<div class="overlay" data-bg><div class="sheet"><div class="grab"></div><div class="st"><h2>Tema oscuro</h2><button class="close" data-act="close">×</button></div><div class="sbox">${[['system','El mismo del dispositivo'],['dark','Oscuro'],['light','Claro']].map(x=>`<div class="srow ${db.set.theme===x[0]?'green':''}" data-theme="${x[0]}"><span class="grow">${x[1]}</span><span>${db.set.theme===x[0]?'●':'○'}</span></div>`).join('')}</div></div></div>`;return''}function bind(){$$('[data-tab]').forEach(x=>x.onclick=()=>{st.tab=x.dataset.tab;st.view='home';st.over=null;st.search='';st.product=null;render()});$$('[data-act]').forEach(x=>x.onclick=e=>act(x.dataset.act,e));$$('[data-open]').forEach(x=>x.onclick=()=>{st.tab='lists';st.view='list';st.list=x.dataset.open;st.search='';st.checked=true;render()});$$('[data-check]').forEach(x=>x.onclick=()=>{let l=db.lists.find(a=>a.id===st.list),i=l.items.find(a=>a.id===x.dataset.check);i.done=!i.done;save();render()});$$('[data-sw]').forEach(x=>x.onclick=e=>{e.stopPropagation();db.set[x.dataset.sw]=!db.set[x.dataset.sw];save();render()});$$('[data-deltrash]').forEach(x=>x.onclick=()=>{db.trash.splice(+x.dataset.deltrash,1);save();render()});$$('[data-rest]').forEach(x=>x.onclick=()=>{let a=db.trash.splice(+x.dataset.rest,1)[0];db.lists.push({id:id(),name:a.name,items:mk(a.t,a.c,'Restaurado')});save();render();toast('Lista restaurada')});$$('[data-prod]').forEach(x=>x.onclick=()=>{st.product=x.dataset.prod;render();scrollTo(0,0)});$$('[data-sug]').forEach(x=>x.onclick=()=>{let n=x.dataset.sug,i=st.selected.indexOf(n);i>=0?st.selected.splice(i,1):st.selected.push(n);render()});$$('[data-sort]').forEach(x=>x.onclick=()=>{db.set.sort=x.dataset.sort;let l=db.lists.find(a=>a.id===st.list);if(l&&db.set.sort==='alpha')l.items.sort((a,b)=>a.name.localeCompare(b.name,'es'));save();st.over=null;render()});$$('[data-theme]').forEach(x=>x.onclick=()=>{db.set.theme=x.dataset.theme;save();st.over=null;render()});$$('[data-ai]').forEach(x=>x.onclick=()=>aiList(x.dataset.ai));let q=$('#pq');if(q)q.oninput=e=>{st.search=e.target.value;render()};q=$('#ls');if(q)q.oninput=e=>{st.search=e.target.value;render()};q=$('#addq');if(q)q.oninput=e=>{st.search=e.target.value;render()};$$('[data-bg]').forEach(x=>x.onclick=e=>{if(e.target===x){st.over=null;render()}})}function act(a){if(a==='back'){if(st.tab==='products'&&st.product){st.product=null;render();return}if(st.view==='add'){st.view='list';st.search='';render();return}if(st.view==='list'){st.view='home';st.search='';render();return}if(st.view==='appearance'){st.view=st.tab==='profile'?'home':'settings';render();return}if(st.view==='settings'||st.view==='trash'){st.view='home';render();return}st.tab='lists';st.view='home';render();return}if(a==='menu'){st.menu=!st.menu;render()}if(a==='trash'){st.menu=false;st.view='trash';render()}if(a==='settings'||a==='profileset'){st.menu=false;st.view='settings';render()}if(a==='appearance'){st.view='appearance';render()}if(a==='theme'){st.over='theme';render()}if(a==='new'){st.over='new';render()}if(a==='close'){st.over=null;render()}if(a==='create'){let n=($('#newname')?.value||'').trim();if(!n)return toast('Escribe un nombre');let l={id:id(),name:n,items:[]};db.lists.push(l);save();st.over=null;st.list=l.id;st.view='list';render()}if(a==='share'){st.over='share';render()}if(a==='listmenu'){st.over='listmenu';render()}if(a==='sort'){st.over='sort';render()}if(a==='searchList'){st.over=null;st.search=' ';render()}if(a==='closeSearch'){st.search='';render()}if(a==='checked'){st.checked=!st.checked;render()}if(a==='add'){st.view='add';st.search='';st.selected=[];render()}if(a==='doneadd'){let l=db.lists.find(x=>x.id===st.list);st.selected.forEach(name=>l.items.unshift({id:id(),name,done:false}));save();st.view='list';st.search='';render();toast('Productos añadidos')}if(a==='checkall'||a==='uncheck'){let l=db.lists.find(x=>x.id===st.list);l.items.forEach(x=>x.done=a==='checkall');save();st.over=null;render()}if(a==='deleteDone'){let l=db.lists.find(x=>x.id===st.list);l.items=l.items.filter(x=>!x.done);save();st.over=null;render();toast('Artículos comprados eliminados')}if(a==='toai'){st.tab='assistant';st.view='home';st.over=null;render()}if(a==='padd'){let p=P.find(x=>x.id===st.product),l=db.lists.find(x=>x.id==='hoy')||db.lists[0];l.items.unshift({id:id(),name:p.n,done:false});save();toast(`${p.n} añadido a Hoy`)}if(a==='ask'){let n=($('#ask')?.value||'').trim();if(!n)return toast('Escribe qué necesitas');db.lists.push({id:id(),name:n,items:['Pan','Leche','Huevos','Fruta','Agua'].map(name=>({id:id(),name,done:false}))});save();toast('Lista creada con 5 sugerencias')}}function aiList(n){let m={'Desayuno saludable':['Avena','Plátanos','Yogur','Huevos','Palta'],'Limpieza del hogar':['Detergente','Guantes','Paños','Bolsas de basura','Limpiavidrios'],'Parrilla':['Carne','Carbón','Sal','Verduras','Bebidas']};db.lists.push({id:id(),name:n,items:m[n].map(name=>({id:id(),name,done:false}))});save();toast('Lista creada')}function toast(t){$('.toast')?.remove();let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1700)}const P=[['Aceite de oliva','🫒'],['Aceite de oliva extra','🫒'],['Aceite de pescado','💊'],['Aceite de pepita','🧴'],['Aceite de sésamo','🧴'],['Aceite vegetal','🧴'],['Aceitunas','🫒'],['Aceitunas negras','🫒'],['Aceitunas verdes','🫒'],['Acelga roja','🥬'],['Achicoria','🥬'],['Ácido cítrico','🍋'],['Aderezo césar','🥣'],['Aderezo francés','🥣'],['Aderezo italiano','🥣'],['Agua','💧'],['Agua de coco','🥥'],['Agua embotellada','🧴'],['Agua mineral','💧'],['Agua mineral sin gas','💧'],['Agua tónica','🥤'],['Agua vitaminada','🥤'],['Cerdo','🥩'],['Ajo en polvo','🧄'],['Ajo picado','🧄'],['Ajos','🧄'],['Alas','🍗'],['Albahaca','🌿'],['Alcachofa','🌱'],['Almendras','🥜'],['Apio','🥬'],['Arándanos','🫐'],['Arroz','🍚'],['Atún','🐟'],['Avena','🥣'],['Azúcar','🧂'],['Banana','🍌'],['Berenjena','🍆'],['Brócoli','🥦'],['Café','☕'],['Calabaza','🎃'],['Camarones','🍤'],['Cebolla','🧅'],['Cerveza de sabor','🍺'],['Cerveza de trigo','🍺'],['Cerveza lager','🍺'],['Cerveza stout','🍺'],['Chalote','🧅'],['Champiñones enlatados','🍄'],['Champiñones','🍄'],['Chaucha amarilla','🫘'],['Chicle','⬜'],['Chicle de menta','⬜'],['Chicles','⬜'],['Chile molido','🌶️'],['Chili','🌶️'],['Chinchulines','🥘'],['Chips de tortilla','🌮'],['Chocolate','🍫'],['Chorizo','🌭'],['Coliflor','🥦'],['Espinaca','🥬'],['Fresas','🍓'],['Galletas','🍪'],['Huevos','🥚'],['Leche','🥛'],['Limón','🍋'],['Manzana','🍎'],['Mantequilla','🧈'],['Naranja','🍊'],['Aguacates','🥑'],['Pan','🍞'],['Papas','🥔'],['Pollo','🍗'],['Queso','🧀'],['Sal','🧂'],['Tomate','🍅'],['Yogur','🥛']].map((x,i)=>({id:'p'+i,n:x[0],e:x[1]}));render();
</script></body></html>
