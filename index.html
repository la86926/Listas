nset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#242424;border-top:1px solid #343434}.light .nav{background:#fff;border-color:#ddd}.nav button{border:0;background:transparent;color:#9f9f9f;font-size:13px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button span:first-child{font-size:25px}.nav button.on{color:var(--green)}.popover{position:absolute;right:20px;top:91px;z-index:50;background:#2d2d2d;border-radius:12px;box-shadow:0 16px 38px #0009;overflow:hidden;min-width:190px}.popover button{width:100%;border:0;background:transparent;color:#eee;padding:16px 18px;text-align:left;font-weight:650;font-size:17px}.back{font-size:34px}.section{font-size:14px;color:#a3a3a3;font-weight:750;text-transform:uppercase;margin:27px 13px 12px}.box{background:var(--panel2);border:1px solid #484848;border-radius:18px;overflow:hidden;margin-bottom:20px}.row{min-height:72px;padding:16px 17px;border-bottom:1px solid #484848;display:flex;align-items:center;gap:13px;font-size:18px;font-weight:620}.row:last-child{border-bottom:0}.grow{flex:1}.sub{display:block;color:#aaa;font-size:14px;font-weight:500;line-height:1.35;margin-top:4px}.chev{font-size:29px;color:#aaa}.switch{width:58px;height:32px;border-radius:30px;background:#727272;position:relative;flex:none}.switch:after{content:"";position:absolute;width:27px;height:27px;left:3px;top:2.5px;background:#fff;border-radius:50%}.switch.on{background:#2dd258}.switch.on:after{left:28px}.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}.thin{height:5px;margin:0 -20px;background:#343434}.thin i{height:100%;display:block;background:var(--green)}.ai{margin:14px 0 7px;border:2px solid #356fae;background:#24313f;border-radius:11px;padding:11px 13px;display:flex;align-items:center;gap:10px;font-size:16px}.items{margin:0 -20px}.item{min-height:74px;padding:13px 20px;background:#242424;border-bottom:1px solid #303030;display:flex;align-items:center;gap:16px}.item.done{background:#171717;color:#888}.check{width:30px;height:30px;border-radius:50%;border:3px solid var(--blue);background:transparent;flex:none;color:#111;font-weight:900}.done .check{background:var(--green);border-color:var(--green)}.iname{font-size:19px;font-weight:590;flex:1}.handle{color:#888;font-size:23px}.hide{margin:0 -20px;background:#111;border-block:1px solid #333;text-align:center;padding:13px;color:#aaa;font-weight:650}.search{height:58px;border:1px solid #484848;border-radius:16px;background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 15px;margin:4px 0 16px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:80px}.product{text-align:center;min-width:0}.pic{aspect-ratio:1;border-radius:14px;background:#3a3832;display:grid;place-items:center;font-size:48px}.pname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:7px}.profile{background:var(--panel);border-radius:28px;padding:26px 20px;text-align:center;position:relative}.avatar{width:82px;height:82px;margin:auto;border-radius:50%;background:linear-gradient(145deg,#ef936b,#f0d7c7 25%,#70cce7 41%,#78589c 59%,#f1a076)}.profile .edit{position:absolute;right:15px;top:15px;border:0;background:#393939;color:#eee;border-radius:18px;padding:8px 14px}.menu{margin-top:14px;background:var(--panel);border-radius:18px;overflow:hidden}.menu .row{border-color:#3a3a3a}.assistant{background:linear-gradient(155deg,#293339,#242424 55%,#26372c);border-radius:24px;padding:24px 20px}.assistant .spark{font-size:39px}.assistant h2{font-size:27px;margin:8px 0}.assistant p{color:#aaa;line-height:1.45}.ask{display:flex;gap:8px}.ask input{flex:1;min-width:0;background:#383838;border:1px solid #505050;color:#fff;border-radius:12px;padding:12px}.ask button{border:0;border-radius:12px;background:var(--green);font-weight:750}.suggest{margin-top:12px;background:var(--panel);border-radius:17px;padding:15px;display:flex;align-items:center;gap:13px}.suggest .em{font-size:34px}.suggest h3{margin:0 0 3px}.suggest p{margin:0;color:#999;font-size:13px}.overlay{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(620px,100%);background:#292929;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.grab{width:44px;height:5px;background:#777;border-radius:5px;margin:0 auto 17px}.sheet-head{display:flex;align-items:center;gap:10px}.sheet-head h2{font-size:26px;flex:1}.close{border:0;width:40px;height:40px;border-radius:50%;background:#3b3b3b;color:#bbb;font-size:25px}.dialog-bg{position:fixed;inset:0;z-index:70;background:#000a;display:grid;place-items:center;padding:22px}.dialog{width:min(430px,100%);background:#303030;border-radius:20px;padding:21px}.dialog h2{margin-top:0}.dialog input{width:100%;height:50px;background:#414141;border:1px solid #555;border-radius:12px;color:#fff;padding:0 12px;outline:0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.actions button{border:0;border-radius:10px;padding:10px 14px;background:#444;color:#fff;font-weight:700}.actions .primary{background:var(--blue);color:#111}.toast{position:fixed;z-index:100;left:50%;bottom:105px;transform:translateX(-50%);background:#eee;color:#111;border-radius:18px;padding:9px 14px;font-weight:650;box-shadow:0 10px 25px #0008}.empty{padding:32px 18px;text-align:center;color:#999}

<body><main class="app" id="app"><section class="screen"><div class="top"><h1>Listas</h1></div><div class="empty">Cargando…</div></section></main>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function mk(n,c,p){var a=[];for(var i=0;i<n;i++)a.push({id:uid(),name:p+' '+(i+1),done:i<c});return a}
function seed(){return{lists:[{id:'compras',name:'compras',items:['Leche','Pan','Huevos','Arroz','Café'].map(function(n){return{id:uid(),name:n,done:false}})},{id:'hoy',name:'Hoy',items:['bolsas, chequeras negras','aspiradora','limpia, vidrios','Guantes para lejía','Bolsa de compras grande para guardar las cosas allí','Llaves','Trapos antipolvo','Jabón'].map(function(n){return{id:uid(),name:n,done:false}}).concat(['Banco Nación','Gasolina','Comprar agua','Recargar celular','Ir al banco','Llevar documentos','Pagar servicio','Comprar medicinas','Llamar a mamá'].map(function(n){return{id:uid(),name:n,done:true}}))},{id:'ch',name:'Chulucanas hoy',items:mk(95,94,'Compra Chulucanas')},{id:'pi',name:'Piura hoy',items:mk(77,76,'Compra Piura')},{id:'lle',name:'Llevar para Piura',items:mk(10,1,'Llevar')},{id:'salud',name:'Vida y salud tienda naturista',items:['Avena','Semillas de chía','Miel','Almendras'].map(function(n,i){return{id:uid(),name:n,done:i===0}})}],trash:[{name:'Sodimac Piura',c:78,t:81},{name:'Lista vindela 2/10',c:8,t:9},{name:'Precio uno',c:21,t:21},{name:'al frente',c:4,t:4},{name:'Verduras',c:3,t:6}],settings:{theme:'dark',last:false,awake:false,multiply:true,prices:true,ai:true},email:'la86926@gmail.com'}}
var base=seed(),db=base;
try{var old=JSON.parse(localStorage.getItem('listas-app-v2')||'null');if(old&&typeof old==='object'){db=old;if(!Array.isArray(db.lists))db.lists=base.lists;if(!Array.isArray(db.trash))db.trash=base.trash;db.settings=Object.assign({},base.settings,db.settings||{});if(!db.email)db.email=base.email}}catch(e){db=base}
var st={tab:'lists',view:'home',list:null,menu:false,modal:null,search:'',showDone:true};
var products=[['Aceite de oliva','🫒'],['Aceitunas','🫒'],['Acelga','🥬'],['Ajo','🧄'],['Albahaca','🌿'],['Almendras','🥜'],['Arándanos','🫐'],['Arroz','🍚'],['Atún','🐟'],['Avena','🥣'],['Azúcar','🧂'],['Banana','🍌'],['Berenjena','🍆'],['Brócoli','🥦'],['Café','☕'],['Camarones','🍤'],['Cebolla','🧅'],['Champiñones','🍄'],['Chocolate','🍫'],['Espinaca','🥬'],['Fresas','🍓'],['Huevos','🥚'],['Leche','🥛'],['Limón','🍋'],['Manzana','🍎'],['Naranja','🍊'],['Palta','🥑'],['Pan','🍞'],['Papas','🥔'],['Pollo','🍗'],['Queso','🧀'],['Tomate','🍅'],['Yogur','🥛']];
function save(){try{localStorage.setItem('listas-app-v2',JSON.stringify(db))}catch(e){}}
function theme(){var t=db.settings.theme||'dark';if(t==='system'&&window.matchMedia)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.body.classList.toggle('light',t==='light')}
function esc(x){return String(x==null?'':x).replace(/[&<>\"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]})}
function nav(){return'<nav class="nav"><button data-tab="lists" class="'+(st.tab==='lists'?'on':'')+'"><span>☷</span>Listas</button><button data-tab="products" class="'+(st.tab==='products'?'on':'')+'"><span>✿</span>Productos</button><button data-tab="assistant" class="'+(st.tab==='assistant'?'on':'')+'"><span>✦</span>Asistente</button><button data-tab="profile" class="'+(st.tab==='profile'?'on':'')+'"><span>♙</span>Perfil</button></nav>'}
function top(title,back,right){return'<div class="top">'+(back?'<button class="icon back" data-act="back">‹</button>':'')+'<h1>'+esc(title)+'</h1>'+(right||'')+'</div>'}
function stat(l){var c=0;for(var i=0;i<l.items.length;i++)if(l.items[i].done)c++;return{c:c,t:l.items.length,p:l.items.length?Math.round(c/l.items.length*100):0}}
function home(){var h='<section class="screen">'+top('Listas',false,'<button class="icon" data-act="menu">•••</button>');for(var i=0;i<db.lists.length;i++){var l=db.lists[i],s=stat(l);h+='<div class="card list-card" data-list="'+l.id+'"><span class="dots">⋮</span><h2>'+esc(l.name)+'</h2><div class="progress-row"><div class="progress"><i style="width:'+s.p+'%"></i></div><span class="count">'+s.c+'/'+s.t+'</span></div></div>'}h+='<button class="fab" data-act="new"><b>＋</b>Nueva lista</button>'+(st.menu?'<div class="popover"><button data-act="trash">🗑️ &nbsp; Papelera</button><button data-act="settings">⚙️ &nbsp; Ajustes</button></div>':'')+'</section>'+nav();return h}
function listView(){var l=db.lists.find(function(x){return x.id===st.list})||db.lists[0],s=stat(l),u=[],d=[];for(var i=0;i<l.items.length;i++)(l.items[i].done?d:u).push(l.items[i]);function rows(a){return a.map(function(x){return'<div class="item '+(x.done?'done':'')+'"><button class="check" data-check="'+x.id+'">'+(x.done?'✓':'')+'</button><div class="iname">'+esc(x.name)+'</div><span class="handle">═</span></div>'}).join('')}return'<section class="screen">'+top(l.name,true,'<button class="icon" data-act="share">♙＋</button><button class="icon" data-act="listmenu">•••</button>')+'<div class="thin"><i style="width:'+s.p+'%"></i></div>'+(db.settings.ai?'<div class="ai" data-tab="assistant">✦ <span class="grow">¿No sabes qué comprar? ¡Pregunta al Asistente!</span>›</div>':'')+'<div class="items">'+rows(u)+'<div class="hide" data-act="done">('+d.length+') '+(st.showDone?'Ocultar':'Mostrar')+' elementos marcados</div>'+(st.showDone?rows(d):'')+'</div><button class="fab" data-act="add"><b>＋</b>Añadir</button></section>'+nav()+modal();}
function settings(){return'<section class="screen">'+top('Ajustes',true)+'<div style="display:flex;align-items:center;gap:14px;margin:8px 0 30px"><div class="avatar" style="width:48px;height:48px;margin:0"></div><b class="muted grow">'+esc(db.email)+'</b><span class="chev">›</span></div><div class="section">General</div><div class="box"><div class="row" data-act="appearance"><span class="grow">Apariencia</span><span class="chev">›</span></div><div class="row"><span class="grow">Notificaciones</span><span class="chev">›</span></div><div class="row"><span class="grow">Abrir la última lista usada al abrir la aplicación</span><span class="switch '+(db.settings.last?'on':'')+'" data-toggle="last"></span></div><div class="row"><span class="grow">Mantener la pantalla encendida</span><span class="switch '+(db.settings.awake?'on':'')+'" data-toggle="awake"></span></div></div><div class="section">Listas</div><div class="box"><div class="row green"><span class="grow">Multiplicar (precio por cantidad)</span><span class="switch '+(db.settings.multiply?'on':'')+'" data-toggle="multiply"></span></div><div class="row green"><span class="grow">Añadir automáticamente los últimos precios</span><span class="switch '+(db.settings.prices?'on':'')+'" data-toggle="prices"></span></div></div><div class="section">Soporte</div><div class="box"><div class="row"><span class="grow">Preguntas frecuentes</span><span class="chev">›</span></div><div class="row"><span class="grow">Reportar un problema</span><span class="chev">›</span></div><div class="row"><span class="grow">Actualizar listas<span class="sub">Actualizar todos los cambios guardados.</span></span><span>⟳</span></div></div></section>'+nav()+modal()}
function trash(){var h='<section class="screen">'+top('Papelera',true);for(var i=0;i<db.trash.length;i++){var x=db.trash[i];h+='<div class="card" style="padding:20px;margin:12px 0"><h2 style="margin:0 0 8px;font-size:23px">'+esc(x.name)+' <span style="float:right;font-size:18px">'+x.c+'/'+x.t+'</span></h2><div class="muted" style="font-size:13px;text-transform:uppercase;margin-bottom:15px">Movido a la papelera</div><div style="text-align:right"><button class="icon red" data-deltrash="'+i+'">BORRAR</button></div></div>'}return h+'</section>'+nav()}
function appearance(){return'<section class="screen">'+top('Apariencia',true)+'<div class="section">General</div><div class="box"><div class="row" data-act="theme"><span class="grow">Tema oscuro</span><span class="muted">'+(db.settings.theme==='dark'?'Oscuro':db.settings.theme==='light'?'Claro':'El mismo del dispositivo')+'</span></div></div><div class="section">Pantalla de inicio</div><div class="box"><div class="row"><span class="grow">Icono de la aplicación</span><span style="font-size:29px">📝</span><span class="chev">›</span></div></div></section>'+nav()+modal()}
function productsView(){var q=st.search.toLowerCase(),a=products.filter(function(p){return p[0].toLowerCase().indexOf(q)>=0});return'<section class="screen">'+top('Productos')+'<div class="search">⌕<input id="psearch" placeholder="Buscar producto" value="'+esc(st.search)+'"></div><div class="grid">'+a.map(function(p){return'<div class="product"><div class="pic">'+p[1]+'</div><div class="pname">'+esc(p[0])+'</div></div>'}).join('')+'</div></section>'+nav()}
function assistant(){return'<section class="screen">'+top('Asistente')+'<div class="assistant"><div class="spark">✦</div><h2>¿Qué necesitas comprar?</h2><p>Escribe una idea y te ayudo a preparar una lista rápida.</p><div class="ask"><input id="ask" placeholder="Ej. cena para 4 personas"><button data-act="ask">Preguntar</button></div></div><div class="section" style="margin-left:0">Sugerencias</div><div class="suggest" data-suggest="Desayuno saludable"><span class="em">🥑</span><div class="grow"><h3>Desayuno saludable</h3><p>Avena, fruta, yogur, huevos y palta</p></div>›</div><div class="suggest" data-suggest="Limpieza del hogar"><span class="em">🧽</span><div class="grow"><h3>Limpieza del hogar</h3><p>Detergente, guantes, paños y bolsas</p></div>›</div></section>'+nav()}
function profile(){return'<section class="screen">'+top('Perfil',false,'<button class="icon" data-act="settings">⚙</button>')+'<div class="profile"><button class="edit">Editar ✎</button><div class="avatar"></div><h3>'+esc(db.email)+'</h3></div><div class="menu"><div class="row" data-act="settings">⚙ <span class="grow">Ajustes</span><span class="chev">›</span></div><div class="row" data-act="appearance">🎨 <span class="grow">Apariencia</span><span class="chev">›</span></div><div class="row">♥ <span class="grow">¿Disfrutas de la aplicación?<span class="sub">Califícanos ⭐⭐⭐⭐⭐</span></span><span class="chev">›</span></div><div class="row">◉ <span class="grow">Ayuda & Comentarios</span><span class="chev">›</span></div></div></section>'+nav()}
function addView(){return'<section class="screen">'+top('Añadir producto',true)+'<div class="search">⌕<input id="newitem" placeholder="Agregar nuevo producto"></div><div class="box"><div class="row" data-quick="Pan">＋ <span>Pan</span></div><div class="row" data-quick="Agua">＋ <span>Agua</span></div><div class="row" data-quick="Arroz">＋ <span>Arroz</span></div><div class="row" data-quick="Leche">＋ <span>Leche</span></div></div><button class="fab" data-act="typedadd">Añadir</button></section>'+nav()}
function modal(){if(st.modal==='new')return'<div class="dialog-bg"><div class="dialog"><h2>Nueva lista</h2><input id="newname" placeholder="Nombre de la lista"><div class="actions"><button data-act="close">Cancelar</button><button class="primary" data-act="create">Crear</button></div></div></div>';if(st.modal==='theme')return'<div class="overlay"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Tema oscuro</h2><button class="close" data-act="close">×</button></div><div class="box"><div class="row" data-theme="system"><span class="grow">El mismo del dispositivo</span>○</div><div class="row" data-theme="dark"><span class="grow">Oscuro</span>○</div><div class="row" data-theme="light"><span class="grow">Claro</span>○</div></div></div></div>';if(st.modal==='share')return'<div class="overlay"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Comparte esta lista</h2><button class="close" data-act="close">×</button></div><p class="muted">Cuando se comparte la lista, todos los cambios pueden verse por quienes tengan acceso.</p><div class="box"><div class="row">🔗 <span>Copiar enlace</span></div><div class="row">💬 <span>Mensajes</span></div><div class="row">◉ <span>WhatsApp</span></div></div></div></div>';if(st.modal==='listmenu')return'<div class="overlay"><div class="sheet"><div class="grab"></div><div class="box"><div class="row" data-act="share">♙＋ <span>Compartir</span></div><div class="row" data-act="checkall">✓ <span>Marcar todos los artículos</span></div><div class="row" data-act="uncheckall">⟳ <span>Desmarcar todos los elementos</span></div><div class="row green"><span class="grow">Mostrar sugerencias de IA</span><span class="switch '+(db.settings.ai?'on':'')+'" data-toggle="ai"></span></div></div><div class="box"><div class="row red" data-act="deletechecked">🗑 <span>Eliminar artículos comprados</span></div></div></div></div>';return''}
function render(){theme();var html='';if(st.tab==='lists'){if(st.view==='home')html=home();else if(st.view==='list')html=listView();else if(st.view==='settings')html=settings();else if(st.view==='trash')html=trash();else if(st.view==='appearance')html=appearance();else if(st.view==='add')html=addView()}else if(st.tab==='products')html=productsView();else if(st.tab==='assistant')html=assistant();else html=profile();app.innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){st.tab=b.getAttribute('data-tab');st.view='home';st.menu=false;st.modal=null;st.search='';render()}});document.querySelectorAll('[data-list]').forEach(function(b){b.onclick=function(){st.list=b.getAttribute('data-list');st.view='list';render()}});document.querySelectorAll('[data-act]').forEach(function(b){b.onclick=function(e){act(b.getAttribute('data-act'),e)}});document.querySelectorAll('[data-check]').forEach(function(b){b.onclick=function(){var l=db.lists.find(function(x){return x.id===st.list}),it=l.items.find(function(x){return x.id===b.getAttribute('data-check')});it.done=!it.done;save();render()}});document.querySelectorAll('[data-toggle]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.getAttribute('data-toggle');db.settings[k]=!db.settings[k];save();render()}});document.querySelectorAll('[data-theme]').forEach(function(b){b.onclick=function(){db.settings.theme=b.getAttribute('data-theme');st.modal=null;save();render()}});document.querySelectorAll('[data-quick]').forEach(function(b){b.onclick=function(){addItem(b.getAttribute('data-quick'))}});document.querySelectorAll('[data-suggest]').forEach(function(b){b.onclick=function(){var n=b.getAttribute('data-suggest');var a=n==='Desayuno saludable'?['Avena','Plátanos','Yogur','Huevos','Palta']:['Detergente','Guantes','Paños','Bolsas','Limpiavidrios'];db.lists.push({id:uid(),name:n,items:a.map(function(x){return{id:uid(),name:x,done:false}})});save();toast('Lista creada')}});document.querySelectorAll('[data-deltrash]').forEach(function(b){b.onclick=function(){db.trash.splice(+b.getAttribute('data-deltrash'),1);save();render()}});var p=document.getElementById('psearch');if(p)p.oninput=function(){st.search=p.value;render()}}
function addItem(n){var l=db.lists.find(function(x){return x.id===st.list});l.items.unshift({id:uid(),name:n,done:false});save();st.view='list';render();toast('Producto añadido')}
function act(a){if(a==='menu'){st.menu=!st.menu;render()}else if(a==='new'){st.modal='new';render()}else if(a==='trash'){st.menu=false;st.view='trash';render()}else if(a==='settings'){st.menu=false;st.view='settings';if(st.tab!=='lists')st.tab='lists';render()}else if(a==='appearance'){st.view='appearance';render()}else if(a==='theme'){st.modal='theme';render()}else if(a==='close'){st.modal=null;render()}else if(a==='create'){var x=document.getElementById('newname');var n=x?x.value.trim():'';if(!n)return;var l={id:uid(),name:n,items:[]};db.lists.push(l);save();st.list=l.id;st.modal=null;st.view='list';render()}else if(a==='back'){if(st.view==='list'||st.view==='settings'||st.view==='trash')st.view='home';else if(st.view==='appearance')st.view='settings';else if(st.view==='add')st.view='list';render()}else if(a==='done'){st.showDone=!st.showDone;render()}else if(a==='add'){st.view='add';render()}else if(a==='typedadd'){var x=document.getElementById('newitem'),n=x?x.value.trim():'';if(n)addItem(n)}else if(a==='share'){st.modal='share';render()}else if(a==='listmenu'){st.modal='listmenu';render()}else if(a==='checkall'||a==='uncheckall'){var l=db.lists.find(function(x){return x.id===st.list});l.items.forEach(function(x){x.done=a==='checkall'});st.modal=null;save();render()}else if(a==='deletechecked'){var l=db.lists.find(function(x){return x.id===st.list});l.items=l.items.filter(function(x){return!x.done});st.modal=null;save();render()}else if(a==='ask'){var q=document.getElementById('ask'),n=q?q.value.trim():'';if(n){db.lists.push({id:uid(),name:n,items:['Pan','Leche','Huevos','Fruta','Agua'].map(function(x){return{id:uid(),name:x,done:false}})});save();toast('Lista creada')}}}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},1600)}
window.addEventListener('error',function(){if(app&&!app.innerHTML.trim())app.innerHTML='<section class="screen"><div class="top"><h1>Listas</h1></div><div class="card" style="padding:22px">La aplicación no pudo cargar. Recarga esta página.</div></section>'});
try{render()}catch(err){console.error(err);app.innerHTML='<section class="screen"><div class="top"><h1>Listas</h1></div><div class="card" style="padding:22px"><h3>Error de carga</h3><p class="muted">Recarga la página. Esta versión evita que vuelva a quedar solo el fondo oscuro.</p></div></section>'}
})();
</script>
</body>
</html>
