<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#202020">
<title>Listas</title>
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>
<main class="app" id="app">
  <section class="screen">
    <div class="top"><h1>Listas</h1></div>
    <div class="empty">Cargando…</div>
  </section>
</main>
<script>
(function(){
  'use strict';
  var files=['core.js','views1.js','views2.js','views3.js','views4.js','runtime1.js','runtime2.js','runtime3.js'];
  var app=document.getElementById('app');
  function fail(message){
    console.error('Error al iniciar Listas:',message);
    app.innerHTML='<section class="screen"><div class="top"><h1>Listas</h1></div><div class="card" style="padding:18px"><h3>No se pudo iniciar la aplicación</h3><p class="muted">'+String(message||'Error desconocido').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</p><button onclick="location.reload()" style="margin-top:12px;border:0;border-radius:22px;padding:11px 18px;background:#69b5ff;color:#111;font-weight:700">Volver a cargar</button></div></section>';
  }
  Promise.all(files.map(function(file){
    return fetch(file+'?v=5-'+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('No se pudo cargar '+file+' ('+r.status+')');
      return r.text();
    });
  })).then(function(parts){
    try{
      var code=parts.join('\n;\n');
      Function(code)();
    }catch(err){
      fail((err&&err.name?err.name+': ':'')+(err&&err.message?err.message:String(err)));
    }
  }).catch(function(err){
    fail(err&&err.message?err.message:String(err));
  });
})();
</script>
</body>
</html>
